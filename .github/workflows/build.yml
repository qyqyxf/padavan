name: build

on: 
  push:
    branches:
    - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [K2P, K2P-NANO, K2P-USB]
        toolchain: [mipsel-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.target }}-${{ matrix.toolchain }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          check-latest: true
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          check-latest: true
      - name: Prepare
        run: |
          sudo apt update
          sudo apt install libtool-bin gperf python3-docutils autopoint gettext ccache
      - name: Build
        run: |
          make ${{ matrix.target }} TOOLCHAIN=${{ matrix.toolchain }}
          if [ "${{ matrix.target }}" = "K2P-NANO" ]; then
            image=$(ls trunk/images/*.trx)
            mv $image $(echo $image | sed 's/K2P/K2P-NANO/')
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.toolchain }}
          path: trunk/images/*.trx

   publish:
    needs: [build]
    runs-on: ubuntu-22.04
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write # ✅ 必须添加，确保有权限创建 Release
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files/   # 统一下载到 release_files 目录
          merge-multiple: true   # 将多个 artifact 的文件平铺合并
          
      - name: List Downloaded Files
        run: ls -R release_files/ # ✅ 调试步骤：在日志中打印出下载的文件结构
        
      - name: Set Tag Name
        # ✅ 增加时分秒，防止同一天多次编译导致 Tag 冲突报错
        run: echo "TAG_NAME=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
        
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Padavan K2P 自动编译 ${{ env.TAG_NAME }}
          # ✅ 直接匹配目录下的所有 .trx 文件
          files: release_files/*.trx
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
